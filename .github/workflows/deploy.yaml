name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare lowercase repo owner
        id: lower
        run: |
          echo "owner_lower=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |          
            echo 'Pulling latest images...'
            docker compose -f ~/PycharmProjects/catty-reminders-app/docker-compose.yml pull
            
            echo 'Stopping and removing old containers...'
            docker compose -f ~/PycharmProjects/catty-reminders-app/docker-compose.yml down
      
            echo 'Starting new containers with Docker Compose...'
            docker compose -f ~/PycharmProjects/catty-reminders-app/docker-compose.yml up -d
            
            echo 'Cleaning up...'
            docker image prune -f
            
            echo 'Docker Compose deployment completed!'
            docker compose -f ~PycharmProjects/catty-reminders-app/docker-compose.yml ps
